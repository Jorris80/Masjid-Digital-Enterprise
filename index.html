<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#134e4a"><meta name="description" content="Masjid Digital Enterprise — manajemen keuangan & administrasi masjid">
<title>Masjid Digital Enterprise</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#115e59;--pl:#ccfbf1;--acc:#b45309;--bg:#f4f6f5;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;--r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);--side:264px;--hdr:60px;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-mode=dark]{--bg:#0b1220;--card:#111a2b;--tx:#e5e7eb;--mut:#94a3b8;--bd:#1f2a3d;--pl:rgba(20,184,166,.14);--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--p)}
.hide{display:none!important}.muted{color:var(--mut)}.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:.92em}.r{text-align:right}.nowrap{white-space:nowrap}.grow{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sp{justify-content:space-between}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Shell ---------- */
#app{min-height:100%}.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--p2),var(--p));color:#fff;padding:14px 12px 24px;scrollbar-width:thin}
.side .brand{display:flex;gap:10px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;overflow:hidden;flex:none;cursor:zoom-in}.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:14px;line-height:1.2}.brand small{opacity:.8;font-size:11px}
.navg{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#fff;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;opacity:.9}
.nav:hover{background:rgba(255,255,255,.1)}.nav.on{background:#fff;color:var(--p2);opacity:1;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav .badge{margin-left:auto}
.main{min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:20;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hdr h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{min-width:0;flex:1;cursor:default}.ttl.edit{cursor:pointer}.ttl.edit:hover h1{text-decoration:underline dotted}
.hbtn{border:1px solid var(--bd);background:var(--card);border-radius:10px;height:36px;min-width:36px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
.hbtn:hover{border-color:var(--p)}
.av{width:36px;height:36px;border-radius:50%;background:var(--pl);color:var(--p2);display:grid;place-items:center;font-weight:700;overflow:hidden;cursor:pointer;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;font-size:28px}
.net{font-size:11px;padding:3px 8px;border-radius:99px;background:#dcfce7;color:#166534;white-space:nowrap}.net.off{background:#fee2e2;color:#991b1b}.net.q{background:#fef3c7;color:#92400e}
.view{padding:20px;max-width:1280px;width:100%;margin:0 auto;animation:fade .14s ease}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph h2{margin:0;font-size:21px}.ph p{margin:2px 0 0;color:var(--mut)}
.menuBtn{display:none}.bnav{display:none}.scrim{display:none}
/* ---------- Komponen ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}.card+.card{margin-top:14px}.grid>.card,.grid>.card+.card{margin-top:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;gap:12px;align-items:flex-start}.kpi .kic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pl);color:var(--p)}
.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:19px;letter-spacing:-.01em;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--p);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px;white-space:nowrap;transition:filter .12s,transform .05s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}.btn.ghost:hover{border-color:var(--p);color:var(--p)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pl);color:var(--p2);white-space:nowrap}
.b-DRAFT,.b-VOID{background:#e2e8f0;color:#334155}.b-SUBMITTED{background:#fef3c7;color:#92400e}.b-APPROVED{background:#dbeafe;color:#1e40af}.b-POSTED,.b-COCOK,.b-AKTIF,.b-LUNAS,.b-BAIK{background:#dcfce7;color:#166534}.b-REJECTED,.b-SELISIH,.b-RUSAK_BERAT{background:#fee2e2;color:#991b1b}.b-REVERSED,.b-REVERSAL{background:#ede9fe;color:#5b21b6}.b-ANTREAN{background:#ffedd5;color:#9a3412}.b-PERLU_PERBAIKAN,.b-DITINJAU{background:#fef3c7;color:#92400e}
[data-mode=dark] .badge{filter:saturate(.9) brightness(.95)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--mut)}
label.f>span.req::after{content:" *";color:var(--bad)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 11px;min-height:40px;font-weight:500;color:var(--tx);outline:none;transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 20%,transparent)}.in.err{border-color:var(--bad)}
textarea.in{min-height:84px;resize:vertical}.ferr{color:var(--bad);font-size:11.5px;font-weight:500;min-height:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fgrid .full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--tx);font-size:13px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tbar .in{width:auto;min-width:140px;flex:1 1 160px}.tbar .in.s{flex:2 1 220px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:color-mix(in srgb,var(--p) 6%,var(--card));text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}.t tbody tr.click:hover{background:color-mix(in srgb,var(--p) 5%,transparent)}
.t tfoot td{font-weight:700;background:color-mix(in srgb,var(--p) 4%,var(--card))}
.pg{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}.empty .ic{width:40px;height:40px;opacity:.5;margin-bottom:6px}
.err-state{padding:24px;text-align:center;color:var(--bad)}
.sk{background:linear-gradient(90deg,var(--bd) 25%,color-mix(in srgb,var(--bd) 50%,var(--card)) 50%,var(--bd) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--p);border-color:var(--p)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--p);border-radius:99px}.bar.over>i{background:var(--bad)}
.list{display:flex;flex-direction:column}.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.li:last-child{border:0}
.amt-in{color:var(--ok);font-weight:700}.amt-out{color:var(--bad);font-weight:700}
.pray{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.pray div{background:var(--pl);border-radius:12px;padding:10px 6px;text-align:center}.pray small{display:block;color:var(--mut);font-size:11px}.pray b{font-size:16px}.pray .now{background:var(--p);color:#fff}.pray .now small{color:#e2fdf8}
.hero{background:linear-gradient(120deg,var(--p2),var(--p) 60%,color-mix(in srgb,var(--p) 70%,var(--acc)));color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.hero .muted{color:rgba(255,255,255,.8)}
.alert{padding:10px 12px;border-radius:10px;background:#fef3c7;color:#78350f;font-size:13px;border:1px solid #fde68a}.alert.bad{background:#fee2e2;color:#7f1d1d;border-color:#fecaca}.alert.ok{background:#dcfce7;color:#14532d;border-color:#bbf7d0}.alert.info{background:#dbeafe;color:#1e3a8a;border-color:#bfdbfe}
[data-mode=dark] .alert{filter:brightness(.85)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:500;word-break:break-word}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:40px;height:40px;border-radius:12px;border:3px solid transparent;cursor:pointer;box-shadow:var(--sh)}.sw.on{border-color:var(--tx)}
.chart svg{width:100%;height:auto;display:block}.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---------- Modal, toast, zoom ---------- */
.mwrap{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.5);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s}
.modal{background:var(--card);border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd)}.mh h3{margin:0;font-size:16px;flex:1}
.mb{padding:18px;overflow:auto}.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--bd);flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;color:var(--mut);padding:6px;border-radius:8px}.x:hover{background:var(--bg)}
#toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#0f172a;color:#fff;padding:11px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:fade .15s;font-size:13px}
.toast.ok{border-left:4px solid #22c55e}.toast.bad{border-left:4px solid #ef4444}.toast.info{border-left:4px solid #38bdf8}
.zoom{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.92);display:flex;flex-direction:column;touch-action:none}
.zoom .zt{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff}.zoom .zt b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom .zb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;height:38px;min-width:38px;cursor:pointer;display:grid;place-items:center}
.zoom .za{flex:1;overflow:hidden;display:grid;place-items:center;cursor:grab}.zoom img{max-width:92vw;max-height:80vh;transform-origin:center;user-select:none;-webkit-user-drag:none;transition:transform .05s;border-radius:6px;background:#fff}
.zoom .zl{color:rgba(255,255,255,.7);text-align:center;font-size:12px;padding:8px}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}.loader .ring{width:44px;height:44px;border:4px solid var(--pl);border-top-color:var(--p);border-radius:50%;animation:rot .7s linear infinite}
.topbar{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:99;width:0;transition:width .3s,opacity .3s}
/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:linear-gradient(150deg,var(--p2),var(--p));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.5px);background-size:22px 22px}
.login .art>*{position:relative}.login .art h1{font-size:34px;line-height:1.15;margin:16px 0 8px}.login .form{display:flex;align-items:center;justify-content:center;padding:32px}
.login .box{width:min(400px,100%)}.login .logo{width:64px;height:64px;border-radius:18px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}.feat div{background:rgba(255,255,255,.1);padding:10px 12px;border-radius:12px}
.pw{position:relative}.pw .in{padding-right:44px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mut);padding:6px}
.watermark{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);font-size:11px;background:rgba(180,83,9,.92);color:#fff;padding:4px 10px;border-radius:99px;z-index:15;pointer-events:none}
/* ---------- Cetak ---------- */
.print-only{display:none}
@media print{.side,.hdr,.bnav,.tbar,.pg,.btn,.no-print,#toasts,.watermark{display:none!important}.shell{display:block}.view{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}body{background:#fff;color:#000}.print-only{display:block}.tw{border:0;overflow:visible}.t th{position:static}}
/* ---------- Responsif ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);z-index:50;transform:translateX(-105%);transition:transform .2s ease;height:100%}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}.scrim.on{display:block;position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:45}
  .menuBtn{display:grid}.view{padding:14px 12px 92px}.hdr{padding:0 10px}.hdr .hide-m{display:none}
  .g2,.g3{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);cursor:pointer;padding:4px 0;position:relative}
  .bnav button.on{color:var(--p);font-weight:700}.bnav .badge{position:absolute;top:0;right:22%;padding:0 5px;font-size:9.5px;background:var(--bad);color:#fff}
  .pray{grid-template-columns:repeat(4,1fr)}.hero .row.sp>div:last-child{text-align:left!important}
  .t.cards thead{display:none}.t.cards tr{display:block;border-bottom:1px solid var(--bd);padding:8px 4px}.t.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 10px;text-align:right}
  .t.cards td .cv{min-width:0;max-width:72%;text-align:right;word-break:break-word}.t.cards td::before{flex:none;content:attr(data-l);color:var(--mut);font-size:11.5px;text-align:left;font-weight:600}.t.cards tfoot tr{display:block}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;width:100%}.mwrap{align-items:flex-end;padding:0}
  .login{grid-template-columns:1fr}.login .art{display:none}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
  #toasts{bottom:80px;right:12px;left:12px;max-width:none}.watermark{bottom:76px}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.kpi b{font-size:16px}.kpi .kic{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide-desk{display:none!important}@media (max-width:860px){.hide-desk{display:grid!important}}
#printArea{display:none}body.printing #printArea{display:block}body.printing #app,body.printing .bnav,body.printing .watermark,body.printing #toasts{display:none!important}
@media print{body.printing #printArea{display:block}}
/* v2.1 */
label.dl{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--mut);flex:1 1 150px}label.dl .in{width:100%;min-height:36px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}

.mapbox{position:relative;z-index:0;isolation:isolate;height:calc(100vh - 290px);min-height:420px;border-radius:14px;border:1px solid var(--bd);overflow:hidden;background:var(--bg)}
.mpin{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--p);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid #fff}.mpin .ic{transform:rotate(45deg);color:#fff;width:20px;height:20px}

/* ---------------- Kompresi gambar (hemat sel & kuota) ---------------- */
function pickImage(maxPx, cb, keepPng) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('Gambar maksimal 8 MB.', 'bad'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var r = Math.min(1, maxPx / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        var out = keepPng && f.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.84);
        if (out.length > 440000) out = c.toDataURL('image/jpeg', 0.7);
        cb(out);
      };
      im.onerror = function () { toast('File gambar tidak valid.', 'bad'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function pickFile(cb) {

    rd.readAsDataURL(f);

  inp.click();
}
function openFile(fileId) {

/* ---------------- Jadwal salat (hisab astronomis, parameter Kemenag RI dapat diatur) ---------------- */
var PT = {
  rad: Math.PI / 180,
  sun: function (jd) {
    var D = jd - 2451545.0, g = (357.529 + 0.98560028 * D) % 360, q = (280.459 + 0.98564736 * D) % 360;
    var L = (q + 1.915 * Math.sin(g * PT.rad) + 0.020 * Math.sin(2 * g * PT.rad)) % 360, e = 23.439 - 0.00000036 * D;
    var RA = Math.atan2(Math.cos(e * PT.rad) * Math.sin(L * PT.rad), Math.cos(L * PT.rad)) / PT.rad / 15;
    RA = (RA + 24) % 24;

  },

/* ---------------- SVG chart ringan ---------------- */
function barChart(series, keys, colors, labels, fmt) {

  });

function donut(items) {

      '<div class="card"><h3>Dokumen legal</h3><div class="col"><button class="btn ghost" data-act="legal" data-k="terms">' + ic('file') + ' Syarat & Ketentuan</button><button class="btn ghost" data-act="legal" data-k="privacy">' + ic('shield') + ' Pemberitahuan Privasi</button><button class="btn ghost" data-act="legal" data-k="notices">' + ic('info') + ' Pemberitahuan Pihak Ketiga</button></div></div>' +
      '<div class="card" style="grid-column:1/-1"><h3>Riwayat versi</h3><div class="list">' + CHANGELOG.map(function (c) { return '<div class="li"><span class="badge">v' + c[0] + '</span><span class="muted nowrap">' + c[1] + '</span><span>' + esc(c[2]) + '</span></div>'; }).join('') + '</div></div></div>';

</script>
<script>
/* Modul keuangan: beranda, transaksi, persetujuan, laporan, anggaran, akun, kotak amal */
'use strict';
var TYPE_L = { INCOME: 'Penerimaan', EXPENSE: 'Pengeluaran', TRANSFER: 'Transfer', OPENING: 'Saldo Awal', REVERSAL: 'Reversal' };
var STATUS_L = { DRAFT: 'Draft', SUBMITTED: 'Diajukan', APPROVED: 'Disetujui', POSTED: 'Diposting', REJECTED: 'Ditolak', REVERSED: 'Dibalik', ANTREAN: 'Antrean offline', VOID: 'Batal' };
var ACC_L = { CASH: 'Kas', BANK: 'Bank', INCOME: 'Penerimaan', EXPENSE: 'Pengeluaran', EQUITY: 'Saldo Dana' };
function badge(s, L) { return '<span class="badge b-' + esc(s) + '">' + esc((L || STATUS_L)[s] || s) + '</span>'; }
function accs() { return S.boot.accounts || []; }
function accById(id) { for (var i = 0, a = accs(); i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function accName(id) { var a = accById(id); return a ? a.code + ' · ' + a.name : '—'; }
function fundName(c) { var f = (S.boot.funds || []).filter(function (x) { return x.code === c; })[0]; return f ? f.name : c; }
function fundOpts() { return (S.boot.funds || []).map(function (f) { return [f.code, f.name + (f.restricted ? ' (terikat)' : '')]; }); }
function needsApproval(t) { return t.type !== 'INCOME' || !!S.boot.settings.incomeRequiresApproval; }
function signAmt(t) { var cls = t.type === 'INCOME' || t.type === 'OPENING' ? 'amt-in' : t.type === 'EXPENSE' ? 'amt-out' : ''; return '<span class="' + cls + '">' + rp(t.amount) + '</span>'; }
function queuedTrx() { return queue().filter(function (q) { return q.action === 'trx.create' && S.boot && q.user === S.boot.user.id; }).map(function (q) { var p = q.payload; return Object.assign({}, p, { id: 'q_' + q.qid, number: '(antrean)', status: 'ANTREAN', createdByName: S.boot.user.name, queued: true }); }); }
function allTrx() { return queuedTrx().concat(S.boot.transactions || []); }
function upsertTrx(t) { var L = S.boot.transactions, i = L.findIndex(function (x) { return x.id === t.id; }); if (i >= 0) L[i] = t; else L.unshift(t); saveBoot(); renderChrome(); }
function afterWrite() { renderView(); refresh(); }

/* ---------------- Beranda ---------------- */
VIEWS.dashboard = {
  t: 'Beranda', render: function (el) {
    var b = S.boot, s = b.summary, m = b.mosque, now = new Date();
    var pf = prayerFor(now), pt = pf.t, nx = nextPrayer(pt);
    var hi = now.getHours() < 11 ? 'Selamat pagi' : now.getHours() < 15 ? 'Selamat siang' : now.getHours() < 18 ? 'Selamat sore' : 'Selamat malam';
    var html = '<div class="card hero"><div class="row sp"><div><div class="muted" style="font-size:12.5px">' + HARI[now.getDay()] + ', ' + tgl(today(), true) + ' · ' + esc(hijri(now)) + '</div><h2 style="margin:4px 0 2px;font-size:22px">' + hi + ', ' + esc(b.user.name.split(' ')[0]) + '</h2><div class="muted">' + esc(m.name) + ' · ' + esc(b.user.roleName) + '</div></div><div style="text-align:right"><div class="muted" style="font-size:12px">Menuju ' + esc(nx.k.charAt(0).toUpperCase() + nx.k.slice(1)) + '</div><b style="font-size:26px" id="cd">' + Math.floor(nx.left / 60) + 'j ' + (nx.left % 60) + 'm</b></div></div></div>' +
      '<div class="card"><div class="row sp" style="margin-bottom:8px"><small class="muted">Sumber: ' + esc(pf.src) + '</small><a href="#" data-go="salat" style="font-size:12px">Jadwal bulanan</a></div><div class="pray">' + PRAYER_KEYS.map(function (k) { return '<div class="' + (k[0] === nx.k ? 'now' : '') + '"><small>' + k[1] + '</small><b>' + pt[k[0]] + '</b></div>'; }).join('') + '</div></div>';
    if (s) {
      html += '<div class="grid g4" style="margin-top:14px">' + [['Saldo kas & bank', rp(s.cash), 'wallet', 'Berdasarkan ledger'], ['Penerimaan ' + s.year, rp(s.income), 'download', 'Transaksi posted'], ['Pengeluaran ' + s.year, rp(s.expense), 'upload', 'Transaksi posted'], ['Menunggu tindakan', num(s.pendingApproval + s.pendingPost), 'clock', s.pendingApproval + ' persetujuan · ' + s.pendingPost + ' posting']].map(function (k, i) { return '<div class="card kpi" ' + (i === 3 ? 'data-go="approvals" style="cursor:pointer"' : '') + '><div class="kic">' + ic(k[2]) + '</div><div><small>' + k[0] + '</small><b>' + k[1] + '</b><small>' + k[3] + '</small></div></div>'; }).join('') + '</div>';
      if (!s.integrity.balanced) html += '<div class="alert bad" style="margin-top:12px">Peringatan integritas: total debit ≠ kredit ledger. Hubungi admin.</div>';
      html += '<div class="grid g3" style="margin-top:14px"><div class="card" style="grid-column:span 2"><h3>Penerimaan vs pengeluaran ' + s.year + '</h3>' + barChart(s.monthly.map(function (x) { return { label: BLN[x.m - 1], a: x.income, b: x.expense }; }), ['a', 'b'], ['var(--p)', 'var(--acc)'], ['Penerimaan', 'Pengeluaran']) + '</div><div class="card"><h3>Saldo per dana</h3>' + donut(Object.keys(s.funds).map(function (k) { return { l: fundName(k), v: s.funds[k] }; })) + '</div></div>';
    }
    var ann = (b.modules.announcements || []).filter(function (a) { return (!a.from || a.from <= today()) && (!a.to || a.to >= today()); });
    var ev = (b.modules.events || []).filter(function (e) { return e.date >= today(); }).sort(function (a, c) { return a.date < c.date ? -1 : 1; }).slice(0, 5);
    var recent = allTrx().slice(0, 6);
    html += '<div class="grid g2" style="margin-top:14px">';
    if (s || recent.length) html += '<div class="card"><div class="row sp"><h3>Transaksi terbaru</h3><a href="#" data-go="trx">Semua</a></div><div class="list">' + (recent.length ? recent.map(function (t) { return '<div class="li" style="cursor:pointer" data-trx="' + esc(t.id) + '"><div class="grow" style="min-width:0"><b style="font-size:13px">' + esc(t.description) + '</b><div class="muted" style="font-size:11.5px">' + tgl(t.date) + ' · ' + esc(t.number) + ' · ' + esc(TYPE_L[t.type]) + '</div></div><div style="text-align:right">' + signAmt(t) + '<div>' + badge(t.status) + '</div></div></div>'; }).join('') : '<div class="empty">Belum ada transaksi.</div>') + '</div></div>';
    html += '<div class="card"><div class="row sp"><h3>Agenda & pengumuman</h3>' + (can('events.read') ? '<a href="#" data-go="events">Semua</a>' : '') + '</div><div class="list">' + ann.slice(0, 3).map(function (a) { return '<div class="li">' + ic('bell') + '<div><b style="font-size:13px">' + esc(a.title) + '</b><div class="muted" style="font-size:12px">' + esc(a.body).substring(0, 140) + '</div></div></div>'; }).join('') + ev.map(function (e) { return '<div class="li">' + ic('cal') + '<div class="grow"><b style="font-size:13px">' + esc(e.title) + '</b><div class="muted" style="font-size:12px">' + tgl(e.date) + ' ' + esc(e.start || '') + ' · ' + esc(e.speaker || e.location || '') + '</div></div></div>'; }).join('') + (!ann.length && !ev.length ? '<div class="empty">Tidak ada agenda terdekat.</div>' : '') + '</div></div></div>';
    if (can('finance.transaction.create')) html += '<div class="card" style="margin-top:14px"><h3>Aksi cepat</h3><div class="row"><button class="btn" data-new="INCOME">' + ic('plus') + ' Catat penerimaan</button><button class="btn warn" data-new="EXPENSE">' + ic('plus') + ' Ajukan pengeluaran</button><button class="btn ghost" data-go="kotak">' + ic('coins') + ' Hitung kotak amal</button>' + (can('finance.report.read') ? '<button class="btn ghost" data-go="reports">' + ic('chart') + ' Laporan</button>' : '') + '</div></div>';
    el.innerHTML = html;
    $$('[data-new]', el).forEach(function (x) { x.onclick = function () { trxForm(x.dataset.new); }; });
    $$('[data-trx]', el).forEach(function (x) { x.onclick = function () { var t = allTrx().filter(function (y) { return y.id === x.dataset.trx; })[0]; if (t) trxDetail(t); }; });
  }
};

/* ---------------- Form transaksi ---------------- */
function trxFields(type, fund) {
  var cash = accs().filter(function (a) { return (a.type === 'CASH' || a.type === 'BANK') && a.active; }).map(function (a) { return [a.id, a.code + ' · ' + a.name]; });
  var cats = accs().filter(function (a) { return a.type === type && a.active && (!a.fund || a.fund === fund); }).map(function (a) { return [a.id, a.code + ' · ' + a.name]; });
  var f = [{ k: 'date', l: 'Tanggal', t: 'date', req: true, def: today() }, { k: 'amount', l: 'Nominal (Rp)', t: 'money', req: true, min: 1 },
    { k: 'fund', l: 'Sumber/jenis dana', t: 'select', req: true, opts: fundOpts(), def: 'OPERASIONAL' },
    { k: 'cashAccountId', l: type === 'EXPENSE' ? 'Dibayar dari (kas/bank)' : type === 'TRANSFER' ? 'Dari akun' : 'Masuk ke (kas/bank)', t: 'select', req: true, opts: cash, ph: 'Pilih akun' }];
  if (type === 'INCOME' || type === 'EXPENSE') f.push({ k: 'categoryId', l: 'Kategori', t: 'select', req: true, opts: cats, ph: cats.length ? 'Pilih kategori' : 'Tidak ada kategori untuk dana ini' });
  if (type === 'TRANSFER') f.push({ k: 'toAccountId', l: 'Ke akun', t: 'select', req: true, opts: cash, ph: 'Pilih akun tujuan', valid: function (v, o) { return v && v === o.cashAccountId ? 'Harus berbeda' : ''; } });
  f.push({ k: 'method', l: 'Metode', t: 'select', opts: [['CASH', 'Tunai'], ['TRANSFER', 'Transfer bank'], ['QRIS', 'QRIS'], ['LAINNYA', 'Lainnya']], def: 'CASH' });
  if (type !== 'OPENING') f.push({ k: 'party', l: type === 'INCOME' ? 'Donatur/pemberi (boleh "Hamba Allah")' : 'Penerima/vendor', max: 120 });
  f.push({ k: 'reference', l: 'No. referensi/nota', max: 60 }, { k: 'description', l: 'Keterangan', t: 'textarea', req: true, minLen: 3, max: 500, full: true });
  return f;
}
function trxForm(type, preset, existing) {
  if (!can('finance.transaction.create')) { toast('Tidak ada izin membuat transaksi.', 'bad'); return; }
  var v = Object.assign({ fund: 'OPERASIONAL', date: today(), method: 'CASH' }, existing || {}, preset || {});
  if (!v.cashAccountId) { var dc = accs().filter(function (a) { return a.type === 'CASH' && a.active; })[0]; if (dc) v.cashAccountId = dc.id; }
  var title = (existing ? 'Edit ' : 'Catat ') + TYPE_L[type].toLowerCase();
  var m = modal({ title: title, body: '<div id="tfx"></div>' + (existing ? '' : '<div id="tpb"></div>') + (type === 'EXPENSE' ? '<div class="alert info" style="margin-top:10px">Pengeluaran ≥ ' + rp(S.boot.settings.approvalThreshold) + ' memerlukan persetujuan Ketua. Pembuat tidak dapat menyetujui sendiri.</div>' : ''), foot: '<button class="btn ghost" data-close>Batal</button>' + (existing ? '' : '<button class="btn ghost" data-s="0">Simpan draft</button>') + '<button class="btn" data-s="1">' + ic('send') + (existing ? ' Simpan' : ' Simpan & ajukan') + '</button>' });
  var fields, pend = existing ? null : pendingBox($('#tpb', m));
  var draw = function () { fields = trxFields(type, v.fund); $('#tfx', m).innerHTML = formHtml(fields, v); bindMoney(m); var fs = m.querySelector('[name=fund]'); fs.onchange = function () { var cur = readFormLoose(m, fields); v = Object.assign(v, cur, { fund: fs.value, categoryId: '' }); draw(); }; };
  draw();
  $$('[data-s]', m).forEach(function (b) {
    b.onclick = function () {
      var d = readForm(m, fields); if (!d) return;
      d.type = type;
      if (existing) {
        btnBusy(b, true);
        api('trx.update', Object.assign(d, { id: existing.id })).then(function (r) { upsertTrx(r.trx); closeTop(); toast('Draft diperbarui'); afterWrite(); }).catch(function (e) { btnBusy(b, false); fail(e); });
        return;
      }
      d.idemKey = 'trx-' + uid(); d.submit = b.dataset.s === '1';
      btnBusy(b, true);
      write('trx.create', d, TYPE_L[type] + ' ' + rp(d.amount)).then(function (r) {
        closeTop();
        if (r.queued) { renderView(); return; }
        upsertTrx(r.trx); toast((r.duplicate ? 'Sudah tercatat sebelumnya: ' : 'Tersimpan: ') + r.trx.number + ' (' + STATUS_L[r.trx.status] + ')');
        var files = pend ? pend.files() : [];
        (files.length && !r.duplicate ? uploadFiles('transaction', r.trx.id, files) : Promise.resolve()).then(afterWrite);
      }).catch(function (e) { btnBusy(b, false); fail(e); });
    };
  });
}
function readFormLoose(root, fields) { var o = {}; fields.forEach(function (f) { var el = root.querySelector('[name="' + f.k + '"]'); if (!el) return; o[f.k] = f.t === 'money' ? Number(el.value.replace(/\D/g, '')) || '' : el.value; }); return o; }

/* ---------------- Detail transaksi + siklus status ---------------- */
function trxDetail(t) {
  if (t.queued) { modal({ title: 'Antrean offline', body: '<p>Transaksi ini tersimpan di perangkat dan akan dikirim otomatis saat online. Nomor transaksi dibuat oleh server setelah sinkron.</p><dl class="kv"><dt>Jenis</dt><dd>' + TYPE_L[t.type] + '</dd><dt>Nominal</dt><dd>' + rp(t.amount) + '</dd><dt>Keterangan</dt><dd>' + esc(t.description) + '</dd></dl>', foot: '<button class="btn bad" id="qdel">Hapus dari antrean</button><button class="btn" data-close>Tutup</button>', onOpen: function (mm) { mm.querySelector('#qdel').onclick = function () { setQueue(queue().filter(function (q) { return 'q_' + q.qid !== t.id; })); closeTop(); renderView(); }; } }); return; }
  var me = S.boot.user.id, mine = t.createdBy === me, acts = [];
  if (['DRAFT', 'REJECTED'].indexOf(t.status) >= 0 && mine) { acts.push(['edit', 'Edit', 'ghost', 'edit']); acts.push(['submit', 'Ajukan', '', 'send']); if (t.status === 'DRAFT') acts.push(['void', 'Batalkan draft', 'ghost', 'trash']); }
  if (t.status === 'SUBMITTED' && needsApproval(t) && can('finance.transaction.approve') && !mine) { acts.push(['reject', 'Tolak', 'bad', 'x']); acts.push(['approve', 'Setujui', 'ok', 'check']); }
  if (t.status === 'APPROVED' && can('finance.transaction.approve') && !mine) acts.push(['reject', 'Batalkan persetujuan', 'ghost', 'x']);
  if (can('finance.transaction.post') && (t.status === 'APPROVED' || (t.status === 'SUBMITTED' && !needsApproval(t)))) acts.push(['post', 'Posting ke buku kas', '', 'check']);
  if (t.status === 'POSTED' && t.type !== 'REVERSAL' && can('finance.transaction.reverse')) acts.push(['reverse', 'Reversal', 'warn', 'undo']);
  if (t.status === 'POSTED' || t.status === 'REVERSED') acts.push(['print', t.type === 'INCOME' ? 'Cetak kuitansi' : 'Cetak bukti kas', 'ghost', 'print']);
  var tl = [['Dibuat', t.createdByName, t.createdAt], ['Diajukan', '', t.submittedAt], ['Disetujui', t.approvedByName, t.approvedAt], ['Diposting', t.postedByName, t.postedAt]].filter(function (x) { return x[2]; });
  var body = '<div class="row sp" style="margin-bottom:10px"><div><div class="mono muted">' + esc(t.number) + '</div><b style="font-size:20px">' + signAmt(t) + '</b></div>' + badge(t.status) + '</div>' +
    (t.rejectReason ? '<div class="alert bad">Ditolak: ' + esc(t.rejectReason) + '</div>' : '') + (t.reverseReason ? '<div class="alert">' + (t.type === 'REVERSAL' ? 'Reversal atas ' + esc(t.reference) : 'Dibalik') + ': ' + esc(t.reverseReason) + '</div>' : '') +
    '<dl class="kv" style="margin-top:10px"><dt>Jenis</dt><dd>' + TYPE_L[t.type] + '</dd><dt>Tanggal</dt><dd>' + tgl(t.date, true) + '</dd><dt>Dana</dt><dd>' + esc(fundName(t.fund)) + '</dd><dt>' + (t.type === 'EXPENSE' ? 'Dari akun' : t.type === 'TRANSFER' ? 'Dari' : 'Ke akun') + '</dt><dd>' + esc(accName(t.cashAccountId)) + '</dd>' + (t.toAccountId ? '<dt>Ke</dt><dd>' + esc(accName(t.toAccountId)) + '</dd>' : '') + (t.categoryId ? '<dt>Kategori</dt><dd>' + esc(accName(t.categoryId)) + '</dd>' : '') + '<dt>Metode</dt><dd>' + esc(t.method) + '</dd><dt>Pihak</dt><dd>' + esc(t.party || '—') + '</dd><dt>Referensi</dt><dd>' + esc(t.reference || '—') + '</dd><dt>Keterangan</dt><dd>' + esc(t.description) + '</dd>' + (t.approvalNote ? '<dt>Catatan persetujuan</dt><dd>' + esc(t.approvalNote) + '</dd>' : '') + '</dl>' +
    '<h4 style="margin:16px 0 6px">Jejak proses</h4><div class="list">' + tl.map(function (x) { return '<div class="li">' + ic('clock') + '<div class="grow"><b>' + x[0] + '</b> ' + (x[1] ? 'oleh ' + esc(x[1]) : '') + '</div><span class="muted">' + wkt(x[2]) + '</span></div>'; }).join('') + '</div><div id="atb"></div><div id="led"></div>';
  var m = modal({ title: 'Detail transaksi', wide: true, body: body, foot: acts.map(function (a) { return '<button class="btn ' + a[2] + ' sm" data-a="' + a[0] + '">' + ic(a[3]) + ' ' + a[1] + '</button>'; }).join('') + '<button class="btn ghost sm" data-close>Tutup</button>' });
  attBox($('#atb', m), 'transaction', t.id, { canAdd: can('finance.transaction.create') && t.status !== 'VOID' && t.type !== 'REVERSAL', canDelete: function () { return ['DRAFT', 'REJECTED', 'SUBMITTED'].indexOf(t.status) >= 0 && (mine || can('finance.transaction.approve')); }, onChange: function () { renderChrome(); } });
  if (t.status === 'POSTED' || t.status === 'REVERSED') api('trx.ledger', { id: t.id }, { silent: true }).then(function (L) {
    var e = m.querySelector('#led'); if (!e) return;
    e.innerHTML = '<h4 style="margin:16px 0 6px">Jurnal (double-entry)</h4><div class="tw"><table class="t"><thead><tr><th>Akun</th><th>Dana</th><th class="r">Debit</th><th class="r">Kredit</th></tr></thead><tbody>' + L.map(function (l) { return '<tr><td>' + esc(l.code + ' · ' + l.account) + '</td><td>' + esc(l.fund) + '</td><td class="r">' + (l.debit ? rp(l.debit) : '') + '</td><td class="r">' + (l.credit ? rp(l.credit) : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }).catch(function () {});
  m.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, run = function (action, payload, msg) { btnBusy(b, true); return api(action, Object.assign({ id: t.id }, payload || {})).then(function (r) { upsertTrx(r.trx); if (r.reversal) upsertTrx(r.reversal); closeTop(); toast(msg); afterWrite(); }).catch(function (er) { btnBusy(b, false); fail(er); }); };
    if (a === 'edit') { closeTop(); setTimeout(function () { trxForm(t.type, null, t); }, 40); }
    else if (a === 'submit') run('trx.submit', {}, 'Transaksi diajukan');
    else if (a === 'approve') confirmBox('Setujui transaksi?', 'Setujui <b>' + esc(t.number) + '</b> senilai <b>' + rp(t.amount) + '</b>?', 'Setujui', 'ok').then(function (ok) { if (ok) run('trx.approve', {}, 'Disetujui'); });
    else if (a === 'reject') confirmBox('Tolak transaksi', 'Transaksi akan dikembalikan ke pembuat untuk diperbaiki.', 'Tolak', 'bad', 'Alasan penolakan').then(function (r) { if (r) run('trx.reject', { reason: r }, 'Ditolak'); });
    else if (a === 'post') confirmBox('Posting ke buku kas?', 'Setelah diposting, nominal tidak dapat diubah. Koreksi hanya melalui reversal.', 'Posting').then(function (ok) { if (ok) run('trx.post', {}, 'Diposting ke buku kas'); });

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '', delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
  if (!rows.length) return [];
  var head = rows[0].map(function (h) { return h.trim().replace(/^'/, ''); });
  return rows.slice(1).map(function (r) { var o = {}; head.forEach(function (h, j) { var v = String(r[j] == null ? '' : r[j]).trim(); if (v.charAt(0) === "'") v = v.slice(1); o[h] = v; }); return o; });
}

<script>

          '<div class="tw"><table class="t"><thead><tr><th>Masjid</th><th class="r">Saldo</th><th class="r">Penerimaan</th><th class="r">Pengeluaran</th><th class="r">Surplus</th><th class="r">Anggaran</th><th class="r">Skor</th></tr></thead><tbody>' + d.mosques.map(function (m) { return '<tr><td>' + esc(m.name) + '</td><td class="r">' + rp(m.cash) + '</td><td class="r">' + rp(m.income) + '</td><td class="r">' + rp(m.expense) + '</td><td class="r">' + rp(m.surplus) + '</td><td class="r">' + (m.budgetPct === null ? '—' : m.budgetPct + '%') + '</td><td class="r">' + m.score + '</td></tr>'; }).join('') + '</tbody><tfoot><tr><td>Total</td><td class="r">' + rp(T.cash) + '</td><td class="r">' + rp(T.income) + '</td><td class="r">' + rp(T.expense) + '</td><td class="r">' + rp(T.surplus) + '</td><td></td><td></td></tr></tfoot></table></div>' +
          '<h3>Saldo gabungan per dana</h3>' + simpleTable(['Dana', 'Saldo'], fundsBal.map(function (f) { return [esc(f.l), rp(f.v)]; }), rp(T.cash)) +
          '<h3>Temuan</h3>' + (flags.length ? '<ol>' + flags.map(function (f) { return '<li><b>' + esc(f.m.name) + '</b>: ' + esc(f.t) + '</li>'; }).join('') + '</ol>' : '<p>Tidak ada temuan.</p>') +
          '<p style="font-size:11px">Sumber: ledger transaksi terposting tiap masjid. Ringkasan agregat tanpa data pribadi.</p>');
      };
      $$('[data-yo]', el).forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); yyOpen(b.dataset.yo); }; });
      var pts = d.mosques.filter(hasXY), mb = $('#yym', el);
      if (!pts.length) { mb.outerHTML = '<div class="muted">Isi koordinat tiap masjid (Pengaturan → Profil masjid) untuk menampilkan peta.</div>'; return; }
      loadLeaflet().then(function (L) {
        if (!document.body.contains(mb)) return;
        var map = L.map(mb, { scrollWheelZoom: false }); baseLayer(L).addTo(map);
        var g = L.featureGroup(pts.map(function (m) { return L.marker([m.lat, m.lng], { icon: mosqueIcon(L) }).bindPopup('<b>' + esc(m.name) + '</b><br>Saldo ' + rp(m.cash) + '<br>Penerimaan ' + d.year + ': ' + rp(m.income) + '<br>Skor ' + m.score + (m.kajianDone ? '<br>Kajian: rata-rata ' + m.kajianAvg + ' jamaah' : '')); })).addTo(map);
        if (pts.length === 1) map.setView([pts[0].lat, pts[0].lng], 14); else map.fitBounds(g.getBounds().pad(0.2));
      }).catch(function (e) { mb.outerHTML = '<div class="muted">' + esc(e.message) + '</div>'; });
    };
    if (cached) draw(cached, !S.online);
    load(false);
  }
};

})();
